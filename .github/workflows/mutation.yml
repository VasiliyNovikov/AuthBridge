name: Mutation testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Run mutation tests
        working-directory: tests/AuthBridge.Tests
        run: dotnet stryker
      - name: Verify the reports and at least one killed mutant per target
        working-directory: tests/AuthBridge.Tests
        run: |
          test -s StrykerOutput/*/reports/mutation-report.html
          jq -er --slurpfile config stryker-config.json '
            .files | to_entries as $files | $config[0]["stryker-config"].mutate[] as $target
            | [$files[] | select(("/" + .key) | endswith("/" + $target)) | .value.mutants[] | select(.status == "Killed")] | length
            | if . > 0 then "\($target): \(.) killed" else error("No killed mutants in \($target)") end
          ' StrykerOutput/*/reports/mutation-report.json
      - name: Upload mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: tests/AuthBridge.Tests/StrykerOutput/*/reports/
          if-no-files-found: error
