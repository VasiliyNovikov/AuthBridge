name: OAuth mutation testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Run OAuth mutation tests
        working-directory: tests/AuthBridge.Tests
        run: dotnet stryker
      - name: Verify the reports and at least one killed OAuth mutant
        working-directory: tests/AuthBridge.Tests
        run: |
          test -s StrykerOutput/*/reports/mutation-report.html
          jq -e 'any(.files | to_entries[];
            (.key | endswith("Common/OAuth.cs")) and any(.value.mutants[]; .status == "Killed")
          )' StrykerOutput/*/reports/mutation-report.json
      - name: Upload mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: oauth-mutation-reports
          path: tests/AuthBridge.Tests/StrykerOutput/*/reports/
          if-no-files-found: error
