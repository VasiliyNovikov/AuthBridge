name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run x64 tests and check the whole-app CRAP baseline
        if: matrix.os == 'ubuntu-24.04'
        run: dotnet crap.cs
      - name: Run Arm64 tests
        if: matrix.os == 'ubuntu-24.04-arm'
        run: dotnet test
      - name: Upload CRAP analysis and coverage
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@v7
        with:
          name: crap-analysis
          path: artifacts/crap/
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            dotnet release.cs "${GITHUB_REF_NAME#v}"
          else
            dotnet release.cs
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  # Runs each package on its own platform.
  smoke-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, package: authbridge-linux-x64 }
          - { os: ubuntu-24.04-arm, package: authbridge-linux-arm64 }
          - { os: windows-latest, package: authbridge-win-x64.zip }
          - { os: windows-11-arm, package: authbridge-win-arm64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
      - if: runner.os == 'Linux'
        run: chmod +x ${{ matrix.package }} && ./${{ matrix.package }} --version
      - if: runner.os == 'Windows'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Expand-Archive ${{ matrix.package }} package
          $version = ./package/authbridge.exe --version
          if ((Get-Item ./package/authbridge.exe).VersionInfo.ProductVersion -ne $version) {
            throw "Windows version resource does not match $version"
          }
          ./package/authbridge.exe install
          Start-Sleep 5
          $authbridge = "$env:LOCALAPPDATA\Programs\AuthBridge\authbridge.exe"
          & $authbridge status
          & $authbridge stop
          Get-Content ~/.authbridge/host.log
          # Logged only if the helper exited through its window, which 'authbridge stop' closes, rather than being killed.
          if (-not (Select-String -Quiet 'helper stopping' ~/.authbridge/host.log)) { throw 'the helper did not stop through its window' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - run: gh release create "$GITHUB_REF_NAME" packages/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
